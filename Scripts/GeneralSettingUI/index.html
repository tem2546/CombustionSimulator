
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>General Settings UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>

  <h1 data-i18n="app.title">全体設定 UI</h1>

  <!-- 上部ツールバー -->
  <div class="toolbar">
    <button id="loadBtn" class="btn" data-i18n="toolbar.load" disabled>初期値を読み込む</button>
    <button id="loadPreBtn" class="btn" data-i18n="toolbar.loadPre" disabled>前回設定を読み込み</button>
    <button id="saveBtn" class="btn primary" data-i18n="toolbar.save" disabled>現在の設定を保存して終了</button>
    <button id="saveAsBtn" class="btn" data-i18n="toolbar.saveAs" disabled>名前を付けて保存…</button>
    <button id="openFileBtn" class="btn" data-i18n="toolbar.open" disabled>設定ファイルを開く…</button>
    <button id="langToggle" class="btn lang" type="button">English</button>
    <span id="msg" class="status mono"></span>
  </div>

  <!-- モード選択 -->
  <div class="mode-selector-container" style="margin: 20px; padding: 15px; background: rgba(245, 245, 245, 0.8); border: 1px solid #ccc; border-radius: 6px; display: flex; align-items: center;">
    <label for="modeSelect" style="font-weight: bold; margin-right: 15px; color: #333;" data-i18n="mode.select_label">実行モードを選択してください:</label>
    <select id="modeSelect" style="padding: 6px 12px; font-size: 15px; border-radius: 4px; border: 1px solid #bbb; background: #fff; cursor: pointer; min-width: 300px;">
      <option value="mode1">1. データ整理</option>
      <option value="mode2">2. データ比較（複数データ整理）</option>
      <option value="mode3">3. CEA_GUI</option>
      <option value="mode4">4. 自作エンジン解析（4パラメータ同定）</option>
      <option value="mode5">5. エンジンパラメータ設計</option>
    </select>
  </div>

  <div class="grid">
    <div class="left">

      <!-- データ整理モード -->
      <div id="panel_mode1" class="mode-panel">
        <fieldset>
          <legend>1. データ整理 モード</legend>
          
          <!-- 推力履歴データの選択 -->
          <div class="field">
            <div class="field-head">
              <label data-i18n="model.thrust">推力履歴データ (.xlsx/.csv/.txt)</label>
            </div>
            <div class="filerow">
              <button id="pickThrustBtn" class="btn" data-i18n="model.pickThrust">推力履歴を選択</button>
              <span id="thrust_fn_label" class="file-label">(未選択)</span>
            </div>
          </div>

          <!-- ノイズ除去実行の選択 -->
          <div class="field">
            <div class="field-head">
              <label for="noiseremoved">ノイズ除去の実行</label>
            </div>
            <select id="noiseremoved">
              <option value="Yes">Yes（ノイズ除去を行った結果も表示）</option>
              <option value="No">No（ノイズ除去をしない）</option>
            </select>
            <span class="note">推力データ全体の移動平均などのノイズ処理を行うか選択します。</span>
          </div>

          <!-- スパイクカット実行の選択 -->
          <div class="field">
            <div class="field-head">
              <label for="spikecut">スパイクカットの実行</label>
            </div>
            <select id="spikecut">
              <option value="Yes">Yes（異常な突出値を除去）</option>
              <option value="No">No（スパイクカットをしない）</option>
            </select>
            <span class="note">センサーの異常値（スパイクノイズ）を自動カットするか選択します。</span>
          </div>

          <!-- csvファイル出力の選択 -->
          <div class="field">
            <div class="field-head">
              <label for="csvout">CSVファイル出力</label>
            </div>
            <select id="csvout">
              <option value="Yes">Yes（整理後の推力履歴をCSV保存する）</option>
              <option value="No">No（CSV保存しない）</option>
            </select>
            <span class="note">処理したデータを「Output」フォルダにCSV形式で書き出すか選択します。</span>
          </div>

          <div class="field">
            <div class="field-head">
              <label>燃料残留時間の算出</label>
            </div>
            <div class="filerow">
              <select id="calc_residual_time" class="select-control" style="width: 100%; padding: 4px; border-radius: 4px;">
                <option value="Yes">計算する (Yes)</option>
                <option value="No">計算しない (No)</option>
              </select>
            </div>
          </div>

        </fieldset>
      </div>

      <!-- データ比較モード -->
      <div id="panel_mode2" style="display:none">
        <fieldset>
          <legend>データ比較設定 (Mode 2)</legend>

          <!-- 比較データ数 -->
          <div class="field">
            <div class="field-head">
              <label>比較するデータ数</label>
            </div>
            <div class="filerow">
              <select id="compareDataNumSelect" class="select-control" style="width: 100%; padding: 4px; border-radius: 4px;">
                <option value="2">2機</option>
                <option value="3">3機</option>
                <option value="custom">その他 (手動入力)</option>
              </select>
            </div>
          </div>

          <!-- データ数入力 -->
          <div id="custom_datanum_row" class="field" style="display:none">
            <div class="field-head">
              <label>データ数を直接入力</label>
            </div>
            <div class="filerow">
              <input type="number" id="customDataNumInput" class="input-control" min="2" value="4" style="width: 100%; padding: 4px; border-radius: 4px;">
            </div>
          </div>

          <div class="field">
            <div class="field-head">
              <label>推力・燃焼室圧スパイクの同期</label>
            </div>
            <div class="filerow">
              <select id="compare_sync_spike" class="select-control" style="width: 100%; padding: 4px; border-radius: 4px;">
                <option value="No">修正しない (No)</option>
                <option value="Yes">ズレがある場合は修正する (Yes)</option>
              </select>
            </div>
          </div>

          <!-- 出力するグラフ -->
          <div class="field">
            <div class="field-head">
              <label>比較出力するグラフ（複数選択可）</label>
            </div>
            <div class="filerow" style="flex-direction: column; align-items: flex-start; gap: 6px; padding-left: 4px;">
              <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="compare_graph_thrust" checked> <span>推力 (thrust)</span>
              </label>
              <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="compare_graph_removed"> <span>ノイズ除去後推力 (removed_thrust)</span>
              </label>
            </div>
          </div>

          <!-- 比較データファイル -->
          <div class="field">
            <div class="field-head">
              <label>比較対象データファイル (.xlsx)</label>
            </div>
            <div class="filerow" style="gap: 10px; align-items: flex-start; flex-direction: column;">
              <div style="display: flex; gap: 8px; width: 100%;">
                <button id="pickCompareFilesBtn" class="btn" style="flex: 1;">対象ファイルを順に選択</button>
                <button id="clearCompareFilesBtn" class="btn btn-danger" style="background-color: #dc3545; color: white;">リセット</button>
              </div>
              <div id="compare_files_list" style="width: 100%; font-size: 0.9em; line-height: 1.6; margin-top: 5px;">
                </div>
            </div>
          </div>
        </fieldset>
      </div>

      <!-- CEA_GUIモード -->
      <div id="panel_mode3" class="mode-panel" style="display:none;">
        <fieldset>
          <legend>3. CEA_GUI モード</legend>
          <p>ここにCEA用のパラメータ入力を後で入れます。</p>
        </fieldset>
      </div>

      <!-- 自作エンジン解析モード -->
      <div id="panel_mode4" class="mode-panel" style="display:none;">
        <fieldset>
          <legend>4. 自作エンジン解析 モード</legend>
          <p>ここにSUBARU解析用の変数を後で入れます。</p>
        </fieldset>
      </div>

      <!-- エンジンパラメータ設計モード -->
      <div id="panel_mode5" class="mode-panel" style="display:none;">
        <fieldset>
          <legend>5. エンジンパラメータ設計 モード</legend>
          <p>ここに初期スロート径などの設計変数を後で入れます。</p>
        </fieldset>
      </div>

      <div id="panel_output" class="common-panel" style="margin-top: 25px;">
        <fieldset style="border: 1px solid #1a7f37; border-radius: 6px;">
          <legend style="color: #1a7f37; font-weight: bold; padding: 0 8px;">出力設定</legend>

          <div class="field">
            <div class="field-head">
              <label for="outputModeSelect">保存先モード</label>
            </div>
            <select id="outputModeSelect" style="min-width: 250px;">
              <option value="auto">自動（デフォルトの Output フォルダ）</option>
              <option value="manual">手動（保存先を自分で指定する）</option>
            </select>
          </div>

          <div id="manual_path_row" class="field" style="display: none;">
            <div class="field-head">
              <label>出力先フォルダ</label>
            </div>
            <div class="filerow">
              <button id="pickDirBtn" class="btn">保存先フォルダを選択</button>
              <span id="result_path_label" class="file-label">(未選択)</span>
            </div>
          </div>

        </fieldset>
        <div style="height: 60px; clear: both;"></div>
      </div>

  
    </div>
  </div>
  <!-- スクリプト読み込み（ビルド方法に応じてパスを調整） -->
  <script type="module" src="./js/app.js" defer></script>


</body>
</html>
